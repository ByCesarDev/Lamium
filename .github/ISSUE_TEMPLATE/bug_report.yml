name: Bug
description: Something in Lamium does not work as it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
      description: A screenshot or short video helps for anything visual.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a world
        2. ...
    validations:
      required: true
  - type: input
    id: minecraft
    attributes:
      label: Minecraft version
    validations:
      required: true
  - type: input
    id: levilamina
    attributes:
      label: LeviLamina version
    validations:
      required: true
  - type: input
    id: lamium
    attributes:
      label: Lamium version
      description: Next to the title in Lamium Settings (`L`). Clicking it copies all three versions in one line.
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Launcher and other mods
      description: How you start the game (LeviLauncher, LIP, manual install) and which other mods are installed.
  - type: textarea
    id: log
    attributes:
      label: Log
      description: >-
        `mods/Lamium/logs/lamium.log`. Look through it before pasting: an error
        line may contain a file path with your Windows user name.
      render: text
